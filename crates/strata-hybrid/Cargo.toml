[package]
name = "strata-hybrid"
description = "Prastara's Rust engine for Nemotron-H, Mistral / Mixtral and GLM-4.7-Flash / DeepSeek (MLA) models: strata engine protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["gpu", "vendor-gpus", "aipac"]
# --model takes a Kosha model pack (.kosha, or the older .am2aipac) (the am2pack crate, AGPL-3.0)
aipac = ["dep:am2pack"]
# weights on GPUs: NVIDIA (CUDA), AMD (ROCm), any Vulkan GPU - strata-gpu's CubeCL kernels (tools/build-hybrid.sh)
gpu = ["dep:strata-gpu", "strata-gpu/wgpu"]
# and NVIDIA's and AMD's own runtimes, which need their toolkits to build: the releases leave them out and use wgpu
vendor-gpus = ["gpu", "strata-gpu/cuda", "strata-gpu/hip"]

[dependencies]
strata-gpu = { path = "../strata-gpu", optional = true, default-features = false }
strata-gguf = { path = "../strata-gguf" }
strata-pack = { path = "../strata-pack" }
am2pack = { path = "../am2pack", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
memmap2 = "0.9"
libc = "0.2"
# remote.rs: mutual TLS with the cluster's node certificates (the same rustls as the server), its pins and node-tls.json
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
sha2 = "0.10"
base64 = "0.22"
rcgen = "0.13"
# vision.rs (am2strata-vision): the pictures' decoders, the ViT's products, erf for GELU
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
matrixmultiply = "0.3"
libm = "0.2"

[[bin]]
name = "am2strata-hybrid"
path = "src/main.rs"

# Inkling 2's image encoder (vision.rs), the ENC protocol of Prastara's image encoder
[[bin]]
name = "am2strata-vision"
path = "src/vision_main.rs"

[dev-dependencies]
strata-tokenizer = { path = "../strata-tokenizer" }

# its own workspace, with the GPU kernels (strata-gpu, CubeCL): not mold's pinned cudarc (strata-media's patch)
[workspace]
members = [".", "../strata-gpu"]

[profile.release]
codegen-units = 16
incremental = true
